Title: "Raumschiffe bauen beim Waterloostraßenfest 2026"
Time: 12.10.2026
Author: Heiner Wolf
Summary: "Galactic Developments mit LEGO-Stand beim Waterloostraßenfest am 22. August 2026: große Modelle zum Anschauen und viele Teile zum Selberbauen"
Tags: [Waterloostraßenfest, Straßenfest, 2026, Stand, LEGO, Kinder, Raumschiffe, Nachbarschaft]
Image: de_Waterloostrassenfest26.jpg
Text: |
    Wie jedes Jahr war Galactic Developments beim [Waterloostraßenfest](https://www.waterloostrassenfest.de/) dabei, dem Straßenfest für und von Nachbar:innen, am Samstag, 22. August 2026.

    Am Stand: die großen LEGO-Modelle zum Anschauen und eine große Kiste voller LEGO-Teile zum Selberbauen.
    Die Idee ist einfach: Jedes Kind baut sein eigenes Raumschiff.

    Das hat wieder bestens funktioniert.
    Von 12 bis 19 Uhr waren durchgehend viele Kinder am Stand und haben gebaut, umgebaut und verglichen.

