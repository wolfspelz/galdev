Title: "Galactic Developments in der Art-Galerie beim MetropolCon / EuroCon 2026"
Time: 06.07.2026
Author: Heiner Wolf
Summary: "Galactic Developments als Exponat in der Art-Galerie beim MetropolCon Berlin, dem EuroCon 2026, 2. bis 5. Juli 2026 im silent green Kulturquartier"
Tags: [MetropolCon, EuroCon, 2026, Berlin, Art-Galerie, Ausstellung, LEGO, Raumschiffe, Hard SF, Worldbuilding]
Image: de_MetropolCon26.jpg
Text: |
    Galactic Developments beim [MetropolCon Berlin](https://metropolcon.eu/), der in diesem Jahr zugleich der EuroCon 2026 war, vom 2. bis 5. Juli 2026 im silent green Kulturquartier in Berlin-Wedding.

    Diesmal nicht am Händlertisch, sondern in der Art-Galerie: Galactic Developments als Exponat zwischen Illustrationen, Skulpturen und Comic-Nostalgie.

    Zu sehen waren das große Rollup mit den Bildern der Timeline, Konstruktionszeichnungen der Raumschiffe und die LEGO-Modelle.
    Dazu ein Laptop mit der Website zum Durchblättern.
