Text: |
    Galactic Developments war beim BuchmesseCon 2026 mit zwei Vorträgen im Pavillon C3 vertreten.
    Beide gehören zur Reihe "Science in Science Fiction": reale Wissenschaft zu den Technologien, die wir aus SF kennen.

    ### Hacking Fusion – Unbekanntes über Fusionsreaktoren

    In der Science Fiction gehören Fusionskraftwerke zum Standard. In der Realität dauert es noch länger. Das müsste aber nicht so sein.

    Es gibt physikalisch bessere Hot-Fusion-Prozesse als die drei bekannten Forschungsrichtungen:

    - **Proton-Bor-Fusion** erzeugt fast keine radioaktive Strahlung.
    - **Focus Fusion** eignet sich für dezentrale 10-MW-Kraftwerke.
    - Mit **Inertial Electrostatic Confinement** haben schon Schulklassen Fusion erreicht. Man kann sogar Fusionsreaktoren kaufen.
    - Und ein Unternehmen benutzt dampfgetriebene Kolben, um Deuterium und Tritium in einem Bleizyklon zu verschmelzen, quasi Steampunk in der Realität.

    Viele überraschende und neue Informationen aus der realen Wissenschaft zu einer unserer Lieblings-SF-Technologien.

    Wann: Samstag, 10.10.2026, 12:00 h, Pavillon C3

    ### Science in Science Fiction II – Die reale Wissenschaft von Star Trek und Star Wars

    In Science Fiction gibt es Überlichtgeschwindigkeit, Aliens, Antigravitation, Terraforming, Schutzschilde, Beamen, Railguns, KI, Fusion, Nano und noch viel mehr.
    Dieser Vortrag gibt einen Überblick, was die moderne Wissenschaft dazu sagt.

    Der Stand der Wissenschaft entwickelt sich weiter. Was stimmt noch und was hat sich geändert?
    Was ist wissenschaftlich fundiert, was wäre vielleicht doch möglich und was wird immer erfundene Wissenschaft bleiben?
    Ein realistischer Blick auf die Technologien von Star Trek und Star Wars.

    Außerdem ein Blick über den Tellerrand, denn auch in der Vergangenheit wurden ab und zu schon Technologien erfunden, die sich vorher niemand vorstellen konnte.

    Die Fortsetzung des Vortrags vom BuCon 2024 mit neuen Themen.

    Wann: Samstag, 10.10.2026, 16:00 h, Pavillon C3

    Wo: beim BuchmesseCon in Dreieich-Sprendlingen [(Programm)](https://www.buchmessecon.de/index.php/programm)

