Text: |
    Galactic Developments mit Stand beim [Dreieich Con 2025](https://dreieichcon.de/) in Dreieich-Sprendlingen am Samstag, 15. November 2025.

    Der Dreieich Con ist ein Rollenspiel-Con.
    Deshalb präsentiert sich Galactic Developments als Lore und Hintergrund mit langer Historie für Hard-SF-Rollenspiel-Szenarien.
    Die Timeline reicht vom 21. Jahrhundert bis ins 34. und liefert für jede Epoche Technologie, Fraktionen, Konflikte und Schauplätze, wissenschaftlich fundiert und in sich konsistent.

    Am Stand wie immer: Rollups, LEGO-Modelle, Bücher, Flyer und die Leinwand.
    Dazu drei Beispiel-Szenarien aus drei verschiedenen Epochen:

    ### 2230 Piraten im Asteroidengürtel

    Im 23. Jahrhundert ist der Gürtel noch weit draußen und unsicher.
    Entlang bekannter Materiestrom-Routen warten Piraten.

    Eine kleine Piratenfregatte gegen einen 200-m-Frachter mit 300.000 t Ladung: 3D-Drucker und Metamaterialien.
    Perfekte Ausrüstung, um sich mit ad hoc hergestellten Drohnen gegen die Piraten zur Wehr zu setzen.
    Nicht einfach ein Piratenüberfall, sondern dreidimensionale Flottenmanöver von Dronhenschwärmen. 

    Raketen, Drohnen, Live-Produktion, Abwärme, Hacking, Battlefield-Shaping.

    ### 2555 Söldnertruppe mit Hero-Ship

    Eine lebendige interplanetare Zivilisation, Technologie wie bei "The Expanse".

    Krieg und Chaos im Solsystem.
    Viele Fraktionen mit alten und neuen Konflikten.
    Alien-Artefakte, die fast magische Dinge können.

    Eine Söldnertruppe holt für verschiedene Geheimdienste die Kohlen aus dem Feuer und entdeckt ein Artefakt, das die solare Zivilisation rettet oder bedroht, je nachdem, wem es in die Hände fällt.

    ### ca. 3000 v.u.Z. Drachenlegenden

    Echsenartige Aliens in 200 Lichtjahren Entfernung: 6000 Jahre später sind sie unsere Nachbarn, Mentoren und Konkurrenten.

    Aber damals erleben sie eine dunkle Zeit.
    Hightech erscheint in der Überlieferung wie Magie.
    Zauberer wirken Wunder, dabei sind es tatsächlich Mikrobot-Wolken, und Charisma +10 ist nur moderne Memetik.

    Hightech-Wunder und Schwerter in der Postapokalypse einer Alienzivilisation, erzählt durch ihre Legenden.

