    ## Ein neues modernes Marco Polo Modell

    Die [Marco Polo](/Timeline/MarcoPoloDilan-2511-Start_der_Marco_Polo_zum_Flug_nach_Ross_614) ist das erste kommerzielle Überlichtschiff.
    Sie startet 2511 zum Flug nach Ross 614, um mit der Zivilisation von Dilan zu handeln.
    Das erste Lego Modell der Marco Polo entstand 2019.
    Das neue Modell ist eine komplette Neukonstruktion und etwa dreimal so groß.

    Modell für BrickLink Studio: [MarcoPolo Modell](/stuff/bricks/GalDev-MarcoPolo-2026.io)

    Online Bauplan: [www.wolfspelz.de/lego-marcopolo](https://www.wolfspelz.de/lego-marcopolo/)

    Alle Modelle: [Lego Modelle](/Blog/lego-Lego_Modelle)

    4196 Teile in 62 Baugruppen

    ## Aufbau

    ### Lore:

    Das Schiff ist ein bewährtes interplanetares Frachtschiff.
    Es hat keinen Rumpf, sondern ein Gerüst, in dem die Container aufgehängt sind.
    Oberhalb und unterhalb des Frachtgerüsts befinden sich starke, metrisch impulsverstärkte Fusionsfackeltriebwerke,
    jeweils mit ihrem eigenen Reaktor und Fusionsbrennstoff.
    Die Emitter der Düsensektion zeigen den bläulichen Schimmer der Cherenkov-Streustrahlung.
    Große Tanks an den Seiten enthalten Stützmasse für die Triebwerke.

    Der hintere Teil des Frachtgerüsts, der sonst auch Container trägt,
    ist für die interstellare Reise umgebaut und enthält zusätzliche Ausrüstung für Langstreckenflüge,
    vor allem Ersatzteillager und Autofabs.
    Auch im vorderen Teil des Frachtbereichs musste ein Drittel der Frachtplätze zusätzlichen Modulen für die lange Reise weichen:
    einem Ausweichhabitat, einem militärischen Shuttle und dem Notreaktor.

    Das Fronthabitat, das bei interplanetaren Frachtflügen einer kleinen Crew für wenige Monate komfortabel Platz bietet,
    wurde für die jahrelange Reise für 7 Personen erweitert
    und mit einem Teleskop und zusätzlichen Langstreckensensoren ausgestattet.

    Das Reaktorgebäude ist fünf Stockwerke hoch. Die Triebwerke sind insgesamt 70 Meter lang, bis zu 30 Meter breit
    und damit so groß wie ein Häuserblock.
    Das gesamte Schiff ist ohne Antennen 100 Meter lang, 70 Meter hoch und 80 Meter breit.
    Es hat die Größe und die Masse eines Flugzeugträgers des 21. Jahrhunderts.

    ## Lego:

    Von vorne nach hinten:

    - **Sensoren und Antenne**: Vorne sitzt eine Sensorphalanx am Habitat. Am Heck Metrik-Sensoren (Trailing Metric Sensor Suite), die die metrischen Komponenten des Normalraumtriebwerks überwachen. Über das Schiff verteilt sind weitere Sensoren angebracht, am Frachtgerüst und an der Hecksektion.
    - **Habitat**: Die Wohnsektion für die Besatzung mit Cockpit. Dazu gibt es ein alternatives Habitat im Frachtbereich.
    - **Tanks**: Zwei Gruppen großer Tanks links und rechts auf Gerüsten, dazu mehrere kleine Tanks mit eigener Basis und Leitungen. Eine Raffinerie ist für die Aufbereitung des Treibstoffs aus lokalen Ressourcen (nur in der Langstreckenversion).
    - **Werkstätten und Versorgung**: Werkstätten und Versorgungscontainer im hinteren Frachtbereich.
    - **Container**: Die Handelsfracht in Containern. Die Marco Polo führt seltene Erden und Edelmetalle mit, weil niemand weiß, was für Dilan wertvoll ist.
    - **Shuttles**: Ein kleines ziviles Shuttle, ein Militär-Shuttle und Schubplattformen (Pusher) zum Rangieren der Container.
    - **Antrieb**: Reaktor mit Schutzgebäude, dahinter die Antriebssektion mit Energie-, Beschleuniger- und Metrik-Abschnitt, Radiatoren und Düse. Die rote Düse mit der bläulichen Cherenkov-Strahlung an den Emittern ist das auffälligste Element des Modells.
    - **Stand**: Das Modell steht auf einem eigenen Stand aus schwarzen Platten mit zwei Säulen. Schwarz für den Wentraum und die transparenten Standsäulen stehen für das Vakuum.

    ### Farben

    Die Grundfarbe ist Light Bluish Gray, dazu Schwarz für Stand und Gerüstteile und Weiß für Tanks und Habitat.
    Dark Bluish Gray setzt Akzente an Reaktor und Antrieb.
    Transparente Teile sitzen an Sensoren und Positionslichtern.
    Die gestreiften Tanks und die gelben Containerrahmen sind die einzigen Farbflächen.

    ### Entwurfsgeschichte

    Das Modell ist in 27 Versionen entstanden, von MarcoPolo2-01 im November 2025 bis MarcoPolo2-27 im Oktober 2026.
    Zwischendurch gab es Zwischenstände zur Optimierung der Teileliste (pre-optimization), Varianten ohne gruppierte Untermodelle (ungrouped) und einen eigenen Render-Stand.
    Die Teile wurden in mehreren Bestellungen bei BrickLink geordert.
    Für jede Nachbestellung gibt es ein eigenes Studio-Modell, das nur die fehlenden Teile enthält.
    Vier Nachbestellungen waren nötig, bis alles da war.

    ### Hinweise zum Nachbau

    Wie bei allen Modellen gilt: vor dem Bestellen die Einzelpreise prüfen.
    Das Modell wurde optimiert, um teure Varianten zu vermeiden, aber die Preise bei BrickLink ändern sich.
    Wer sich nicht an die Farben gebunden fühlt, kann besonders bei den Gerüstteilen in Light Bluish Gray auf günstigere Farben ausweichen.

    Die Baugruppen lassen sich am besten in der Reihenfolge von Studio bauen:
    zuerst der Core Beam und der Stand, dann die Tankgruppen und das Habitat, zuletzt Antrieb, Container und Shuttles.
    Die Antenne und die Sensoren sind fragil und kommen ganz am Schluss.

