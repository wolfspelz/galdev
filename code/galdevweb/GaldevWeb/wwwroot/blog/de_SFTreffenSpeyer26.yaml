Text: |
    Mit Galactic Developments beim Science Fiction Treffen 2026 im Technik Museum Speyer, 26. und 27. September 2026.

    "Fiktion trifft Realität" ist das Motto des Treffens in Europas größter Raumfahrtausstellung.
    Das passt sowas von: Science Fiction mit realer Wissenschaft ist genau unser Thema.

    Zwischen Star Wars, Star Trek, Cosplay, viel LEGO zum selber Bauen und der German Garrison stand Galactic Developments: 
    Wie immer, Rollups, Bildergalerie, LEGO-Modelle, Bücher, Flyer und die Leinwand, auf der das neueste Modell der Marco Polo langsam rotiert.

