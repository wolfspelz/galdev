Text: |
    Galactic Developments war bei der [re:publica 24](https://re-publica.com/) in Berlin, dem Festival für die digitale Gesellschaft, mit dem Vortrag "Science in Science Fiction" auf Stage 10.

    In Science Fiction gibt es Überlichtgeschwindigkeit, Antigravitation, Terraforming, Schutzschilde, Beamen, Railguns, KI, Fusion, Nano und noch viel mehr.
    Der Vortrag gibt einen Überblick, was die moderne Wissenschaft dazu sagt:
    Was ist wissenschaftlich fundiert, was wäre vielleicht doch möglich und was wird immer erfundene Wissenschaft bleiben?

    Außerdem ein Blick zurück, denn auch in der Vergangenheit wurden ab und zu Technologien erfunden, die sich vorher niemand vorstellen konnte.

    Die re:publica hat den Vortrag aufgezeichnet.
    Die knapp 56 Minuten gibt es oben im Video oder direkt auf YouTube:

