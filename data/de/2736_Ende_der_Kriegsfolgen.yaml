    Ende der Reparationen und Freilassung der letzten Gefangenen.

    Kriegsverbrecherprozesse gegen die Befehlshaber der KZ von Illud und der Bombardierung von Ticudeztu.
    Solche Ereignisse vor und während des Krieges müssen sogar bei einer nicht-solaren Sichtweise als Ausnahmen und nicht als charakteristisch für das Verhalten der Menschen in dieser Zeit betrachtet werden.
    Dieses Bewusstsein in der kisorischen Öffentlichkeit hatte wesentlichen Einfluss auf die Behandlung der Erde nach dem Krieg.

    Hilfen kisorischer NGOs und Start von Hilfsprogrammen gegen Hungersnöte und Seuchen.
    Die Hilfen werden vor allem von kisorischen Nichtregierungsorganisationen getragen.

    2737 Stärkung der irdischen Selbstverwaltung durch Aufhebung der Kontrolle über einige Industriezweige und Übertragung der Regionalverwaltungen an Menschen.

    2738 Aufhebung des Handelsausschlusses unter dem nur die Gilden zum Außenhandel berechtigt waren.

    Nach der Aufhebung des Handelsausschlusses erreichen auch wieder Handelsschiffe von den äußeren Kolonien die Erde und schon bald bewegen sich die Schiffe der Koalition, wie vor dem Krieg unter den Sternen der Außenwelten, jedoch nicht mehr als Vertreter des Mutterplaneten gegenüber den Kolonien, sondern als gleichberechtigte Handelspartner.

    2739 Wahl zu Staatsregierungen.

    2740 Lösung der Besatzungstruppen aus dem Alltagsleben.

    2741 Aufhebung der Kontrolle über die Gesamtwirtschaft und Abzug eines Großteils der Besatzungstruppen.

