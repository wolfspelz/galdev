Year: 2229
Title: Der energetische Hohlleiter wird entwickelt
ShortTitle: Bessere Energieübertragung
Author: Heiner Wolf
Changed: 2026-07-25
Tags: [_hidden, _nobook]

Markdown: |
  Hohlleiter für Energie ersetzen den Transport von Energie durch elektrischen Strom über supraleitende Kabel.
  Technologien, die Energie direkt verwenden können, d.h. nicht auf elektrischem Strom basieren, profitieren von der verlustfreien Umsetzung zwischen Erzeuger und Verbraucher.
  Dazu gehören auch Raumschifftriebwerke, sowohl konventionelle Strahltriebwerke als auch später Normalraumtriebwerke mit Überlichtkomponenten und Überlichttriebwerke.

