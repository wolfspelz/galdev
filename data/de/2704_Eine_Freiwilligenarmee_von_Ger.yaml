Year: 2704
Title: Menschen helfen Fremden gegen Neobarbaren
Author: Heiner Wolf
Changed: 2026-07-25
Text: |
    Eine Freiwilligenarmee von Germania verhindert die Versklavung der Völker Kelans durch Neobarbaren. Zusätzlich helfen überraschenderweise aaronische Söldner unbekannter Abstammung.

