Markdown: |
  Am dreihundertsten Jahrestag der ersten Mondlandung leben eine Million Menschen und Uploads außerhalb der Erde.
  Die Bevölkerung verteilt sich über einen großen Teil des Sonnensystems.
  Insgesamt gibt es 12.000 bewohnte Strukturen: Raumstationen, Raumschiffe, Industrieanlagen, rotierende Habitate, Asteroidenbasen und weitgehend automatisierte Infrastrukturanlagen.
  Betrieben werden sie von privaten und staatlichen Akteuren, wobei die privaten weit mehr Aktivitäten entfalten.

  In der Erdumlaufbahn leben 320.000 Menschen in rotierenden Habitaten.
  Weitere 70.000 leben in Raumstationen und in Wohnbereichen von orbitalen Industrieanlagen.
  Der Erdorbit ist die dichteste Region des Sonnensystems.
  Er liefert vor allem Hightechprodukte für die Informations- und Biotechnologie der Erde.

  Auf dem Mond leben 210.000 Menschen, überwiegend in den großen Mondbasen, die anderen in Industrieanlagen und Stationen, einige davon im Mondorbit.
  Der cis-lunare Raum zwischen Erde und Mond, einschließlich der Lagrange-Punkte, beherbergt weitere 230.000, hauptsächlich in rotierenden Habitaten.
  Vor allem Lagrange-5 ist sehr wichtig für die orbitale Wirtschaft mit industriellen Aktivitäten, die inzwischen schon dem Erdorbit Konkurrenz machen.
  Von L5 starten außerdem die meisten Missionen in den Gürtel.

  Jenseits des Erde-Mond-Systems ist der Mars mit 40.000 Einwohnern das nächste Bevölkerungszentrum, verteilt auf Bodenbasen, Schiffe und Industrieanlagen.
  Die inneren Planeten, einschließlich Venus und Merkur, sowie der Asteroidengürtel beherbergen kleinere, aber bedeutende Basen im Raum und auf den Planeten, die sich auf Forschung und industrielle Produktion konzentrieren.
  Die Wolkenstädte der Venus haben zusammen 50.000 Bewohner.

  In den nahen Sonnenumlaufbahnen warten 20.000 Menschen die Energieinfrastruktur, die den Rest des Systems mit gebündeltem Sonnenlicht versorgt.
  Die äußeren Regionen tragen mit insgesamt 20.000 Menschen zur menschlichen Präsenz im Sonnensystem bei.
  Dort dominieren noch Forschungsstationen, die großen astronomischen Instrumente und Teleskope bei den Gasriesen und ihren Monden.
