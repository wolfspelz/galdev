Markdown: |
  Im Laufe der letzten Jahrzehnte hat die Bevölkerung, die den Raum von der Erde bis zum Mond bewohnt
  – einschließlich der Erde-Mond L4/L5 Punkte und des Erde L1 Punkts –, kontinuierlich zugenommen.
  Mittlerweile leben und arbeiten mehr als tausend Menschen im Weltraum.
  Ein großer Teil davon ist beim internationalen SCALE-Projekt beschäftigt,
  das Sonnenlichtkontroll- und Begrenzungsvorhaben (Sunlight Control and Limitation Effort),
  das einen Sonnenschirm zwischen der Erde und der Sonne betreibt.

  Die zweite Internationale Raumstation, eine multinationale Station, angeführt von Indien, Nigeria und China,
  dient als Zentrum für wissenschaftliche Forschung und technologische Entwicklung.
  Sie hat hundert Bewohner und künstliche Gravitation.
  Nach dem Crash arbeiten viele Raumfahrtnationen in der Weltraumforschung hier wieder zusammen.

  In mehreren Forschungsbasen auf dem Mond
  und bei Solarkraftwerken im Orbit leben insgesamt 120 Astronauten, Taikonauten und Antarikshas.
  Das Mars Transit Habitat, eine Rüst- und Versorgungsbasis für Marsmissionen,
  wird von einer Minimalbesatzung von 12 Personen betrieben.
  Mehrere touristische Ziele im Orbit und auf dem Mond beherbergen gleichzeitig etwa 200 Touristen.
  Das Weltraummüll-Räumungsnetzwerk (Space Debris Collection Network)
  und der transorbitale Raumschleppdienst TOAST (Transit Orbital Assistance and Space Towing) haben jeweils ca. 30 Mitarbeiter im Orbit.
  Sie mildern das wachsende Problem des Weltraummülls
  und erbringen Dienstleistungen für die Betreiber von Satelliten und Raumfahrzeugen.

  Im Zentrum der Aktivitäten steht SCALE.
  Das Projekt entstand als Reaktion auf die globale Erwärmungskrise.
  Es beschäftigt 400 Mitarbeiter in Mondfabriken, in der Erdumlaufbahn und am Erde-Sonne L1-Lagrange-Punkt.
  Neben den Menschen verarbeiten dort Zehntausende von Baudrohnen autonom Millionen Tonnen Titan und Aluminium zu Gitterstrukturen und Folien.

  Die OMF (Off-Earth Manufacturing Facility) und ein biologisches Forschungslabor sind jeweils mit 25 Personen besetzt.
  Die Eisminen auf dem Mond und das multinationale Deep Space Gateway im Mondorbit haben 20 und 15 Mitarbeiter.
  Sie versorgen Missionen jenseits des erdnahen Raums mit Vorräten und Treibstoff.

  In der Space Elevator Research Station erforschen 10 Mitarbeiter Technologien für einen zukünftigen Weltraumaufzug.
  Das verteilte Deep Space Observatory ist Heimat für insgesamt 15 Forscher,
  während verschiedene Kometenforschungseinrichtungen im erdnahen Raum und darüber hinaus 20 Wissenschaftler, Techniker und Prospektoren beschäftigen.
  Die Interstellar-Probe-Startanlage, betrieben von StarSail,
  bereitet sich darauf vor, Sonden in den interstellaren Raum zu schicken.
  Ein kleines technisches Team betreut die leistungsstarken Laser und Fusionsreaktoren der Anlage,
  die dem Antrieb der Sonden dienen.

  Es gibt eine Vielzahl kleinerer Stationen in niedrigen und hohen Erdumlaufbahnen,
  die von privaten Unternehmen und Nationalstaaten betrieben werden.
  Diese Stationen beherbergen einen erheblichen Teil der im Weltraum lebenden Bevölkerung.
  Sie forschen, bauen Weltraumressourcen ab und beginnen in kleinem Maßstab mit der Fertigung für Kunden im Orbit.
  Die Möglichkeit, Ausrüstung und Ersatzteile direkt im Orbit herzustellen,
  reduziert den Bedarf an kostspieligen Frachtlieferungen von der Erde.
  Diese serviceorientierten Stationen, zusammen mit den Mond-Bergbauanlagen,
  sind die ersten Anfänge einer interplanetaren Wirtschaft.

