Markdown: |
  The human population living off Earth including uploads has reaches an impressive one million people, spread across various structures throughout the Sol System.
  There are a total of 12,000 structures, including space stations, spacecraft, industrial facilities, rotating habitats, asteroid bases, and automated infrastructures.
  These structures reflect the advanced technological capabilities and the multitude of enterprises from private, corporate, and state actors driving humanity's presence in space.

  Earth orbit remains a significant hub of activity with a population centered around rotating habitats that house 320,000 individuals.
  In addition, space stations, industrial facilities, and various other structures support an additional 65,000 people.
  Earth's orbital space has become a bustling commercial region.

  The Moon and cislunar space have also become major centers of human settlement.
  The Moon supports 210,000 people, predominantly in large Moon bases, with additional populations in industrial facilities and space stations.
  Cislunar space, the area between Earth and the Moon including the Lagrange points, hosts another 230,000 individuals, mostly in rotating habitats and space stations.

  The inner planets, including Venus and Mercury, and the asteroid belt support smaller yet substantial communities, focused on research and industrial production.
  Specifically, the cloud cities of Venus house 50,000 people.
  Beyond the Earth-Moon system, Mars emerges as the next significant population center with 40,000 inhabitants spread across ground bases, spacecraft, and industrial facilities.
  Close solar orbits are home to energy infrastructure operated by 20,000 people, powering human activity across the Sol System.
  The outer planets and the orbits beyond them also hold a combined population of 20,000.
  The presence in the far reaches goes beyond research outposts staffed in rotation: even this far out, residence becomes permanent and commercial services begin to take hold.
  