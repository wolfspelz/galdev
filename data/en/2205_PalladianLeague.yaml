    The early 23rd century brings great changes to the political landscape of the Sol System: the rise of corporate sovereignty and territorial claims across space.

    The uprising in the lunar penal colonies of 2197 showed how much chaos and devastation the independence bids of off-world settlements can unleash.
    The revolt involved prisoners taking control of crucial facilities, including shuttles, communication systems, and a mass driver.
    This uprising eventually escalated to a declaration of independence from Earth, which was quelled forcefully despite the rebels resorting to nuclear extortion.

    These memories are still fresh as the asteroid base Vortex Prime, located in the belt, boldly declares its independence in 2205.
    The governments, ready to maintain their dominance and drawing lessons from the past rebellion, deploy the Space Patrol, a measure that proves logistically challenging due to the vast distance separating Earth from the asteroid belt.
    While the penal colony uprising on the Moon was only a light second and one day travel time away, the effort to get to the belt is much greater and more time-consuming.

    At this point, Vortex Prime is a highly developed asteroid base.
    It operates a wide variety of mining scouts ranging from a myriad of small, automated analytics drones to massive industrial extraction and processing vessels.
    Interestingly, a significant number of these units are equipped with explosives intended for prospecting and mining purposes.
    These range from mass impactors and chemical explosive packages to nuclear devices.
    Some of these create minor detonations, churning up material for spectral analysis from a distance.
    Larger charges are used for asteroid excavation, to fuse rubble piles into solid shells, or to break off large fragments from massive, solid asteroids.
    Considering such mining equipment includes remote delivery mechanisms, this hardware is essentially a fleet of nuclear missiles ready for deployment.
    And due to the long travel time, Vortex Prime is able to disperse its forces, making it impossible for the Space Patrol to neutralize them.
    This leads to a prolonged standoff that is finally resolved by negotiations.

    The peaceful settlement despite Earth's determination to suppress the independence movement can be largely attributed to Callie Yuen.
    Yuen is an experienced diplomat and a charismatic leader.
    She often takes personal risks to defuse situations before they escalate.
    She believes in a peaceful coexistence between Earth and the self-governing off-world entities for the age of independence to truly prosper.

    In 2208, Vortex Prime reaches its goal.
    Earth's governments grant the base partial autonomy, giving Vortex Prime sovereignty over all activities taking place outside of Mars's orbit.
    The agreement is the turning point at which it becomes clear how far Earth's view of the interplanetary economy has shifted.

    The situation further escalates in 2210 when Ryugu Outpost and Helios One Solar Power also declare their independence, emboldened by the example set by Vortex Prime.
    Both companies hold an important position in the interplanetary economy, diverting concentrated beams of solar power through the system.
    Their enormous solar mirror arrays could cause devastating destruction if misused.
    Even without nuclear weapons this creates a stand-off, which finally forces Earth's governments to recognize their independence rather than risk open conflict.

    By 2212, the era of station and base independence kicks into high gear.
    Quite surprisingly, Vortex Prime claims sovereignty over a segment of the asteroid belt.
    This area spans a 5-degree arc around their base, extending 20 million kilometers both inward and outward from their orbit.
    Orthogonally to the ecliptic, the claim is somewhat ambiguous, but it is understood that it covers all orbits that cross the region described by the arc segment and the distance from the Sun.
    Despite the ambiguity concerning intersecting orbits, Vortex Prime's claim is generally accepted.

    Vortex Prime's claim to a huge exclusive economic zone triggers a wave of further independence declarations.
    Various entities, motivated by this precedent, race to stake their claim over portions of the asteroid belt or other resource-rich regions, to secure their share of the rapidly growing interplanetary economy.
    All of these new nations have viable business models that give them the economic strength for independence:

    - Terra Nova Station is important for the interplanetary transit sector. Its commercial hubs connect the orbital routes by matter stream, and vessels crossing the Sol System refuel there.
    - Serenity Haven operates a large fleet of asteroid mining ships with countless prospector and extractor drones.
    - Shangri-La Complex steps into independence with a different angle. It is a research house, and its patents run a good part of the Sol System's tech industry. Shangri-La, founded by the Indus Valley Federation, is the only state-operated entity claiming independence this early.
    - The Kalpana Chawla Center is known for its advanced biomedical research specializing in 0G-adaptations using nanite-therapy and synthetic biology. With the independence movement, not only does their primary hub secure autonomy, but an extensive network of offices and medical treatment facilities scattered across the inner Sol System also collectively achieve sovereign status, making Kalpana Chawla the first distributed corporate nation.
    - Avalon is an intricate network of communication relays and data servers. It provides the backbone of interplanetary data traffic and processing. Furthermore, Avalon is a repository of countless secrets belonging to political and economic entities. This wealth of sensitive information furnishes Avalon with a potent, non-violent bargaining chip during negotiations.
    - Curie-Da Vinci Technology is specialized in high-tech manufacturing, producing everything from micro-drones to large-scale space habitats. Its products are critical to many other interplanetary ventures.
    - Polaris Pathway Transit Hub is an indispensable player in interplanetary logistics. In addition to providing the bulk of resources for construction of the ultra-long baseline gravity detector, its in-flight refueling matter stream network dominates a large segment of the outer asteroid belt.
    - Jade Rabbit Matter Stream Co. and Stellar Silk Road are both covering a full 8th of the belt with their unique drone-based matter stream services made of thousands of mobile streaming hubs.
    - Crucible Shipbuilding is a premier construction network for interplanetary vessels covering the entire value chain from mining, meta-material fabrication, component-production, to the construction of ships and station modules.

    These space stations, asteroid bases, and corporate conglomerates are essential to the orbital economy.
    Although legally under the jurisdiction of various Earth nations, they are self-governed by their owners and operators.
    Their internal security is maintained by dedicated departments or external service providers.
    Earth's governments do not oppose this wave of declarations of independence.
    For all major nations, space is of strategic importance and most rely on the services of these companies for their space operations.
    It is also beneficial that many of the space companies now declaring independence are subsidiaries and affiliates of Earth-based conglomerates.
    These global companies wield significant influence over Earth's governments, and they are now leveraging their power to stake claims in space.

    On Earth, a large portion of the oceans is divided among nations and peoples, and in the open seas, companies and private individuals have long been building stateless artificial islands.
    However, in space, global corporations now see an opportunity to stake their claims while some are merely compelled to act before others beat them to it.
    Given the dominance of private companies in space, the march towards independence across the Sol System may have been inevitable, but it's unlikely it would have transpired so rapidly and smoothly without the shrewd efforts of Alexander "Apollo" Ivanov, the head of Helios One Solar Power.

    Born in 2162 close to the Moscow radiation zone, Alexander Ivanov was a bright child in an impoverished family.
    After his bot-mechanic father's death, his mother struggled to make ends meet, often working double shifts as a cleaning swarm-pusher to provide for her two children.
    Alexander's auto-tutor reported on his brilliance.
    This won him a scholarship with cybernetic edu-upgrades and individual lessons at the University of Landskrona, supported by Elysium Industries, a top telecom company.

    Alexander joined Elysium after graduating, quickly ascending to Head of Research and Development.
    There, he earned the nickname "Apollo" for his numerous breakthroughs in solar-powered communication drone swarms.
    Alexander wanted something larger than that: to sell the Sol System its power off the Sun.
    He persuaded Elysium's board to pivot towards solar energy production in close solar orbit.
    Under Alexander's leadership, Elysium became Helios One Solar Power, revolutionizing interplanetary energy logistics with solar mirror arrays, providing sustainable power to distant outposts and energy-intensive industrial operations.
    This move was a significant gamble, but it paid off as the demand for beamed solar energy skyrocketed, establishing Helios One as a major player in the interplanetary economy.

    Then in 2210, taking a page out of the Vortex Prime playbook, Alexander declared Helios One Solar Power's independence as a sovereign nation.
    Although Vortex Prime had established a precedent, there was no certainty that Earth's nations would acknowledge this newfound independence or refrain from retaliatory action.
    Recognizing this, Ivanov had already allied with other prominent interplanetary service providers years prior, forming a league of autonomous space stations and asteroid bases.
    The birthplace of this league was Pallas, the headquarters of Vortex Prime.

    When Vortex Prime stakes their territorial claim two years later, Alexander's Helios One quickly follows suit with a claim to a sector of the Sun's close orbit.
    These dual territorial declarations initiated the wave of independence in 2212.
    Numerous economically independent stations desired sovereignty, eager to stake their own territorial claims rapidly.
    While Vortex Prime could be viewed as an isolated incident, Helios One's declaration of independence and subsequent claim to a portion of the Sun's orbit made it evident to everyone that the scramble for interplanetary territories had begun.

    In reality, Alexander Ivanov of Helios One had masterminded and orchestrated this entire sequence of events over an extended period.
    Each move was a calculated escalation of the previous one, with the aim of peacefully transitioning from a Sol System of space stations governed by various nations to one divided amongst sovereign corporations, while successfully bypassing resistance from Earth's governments.

    As the 23rd century unfolds, a new order emerges: a network of advanced, economically autonomous bases and space stations.
    They represent the backbone of the interplanetary economy.
    The vast majority is owned by global giga-corporations, gaining independence from Earth's governments by securing sovereign rights in outer space.

    Helios One is literally – and figuratively – a beacon in the new system of interplanetary corporate nation states
    while Alexander "Apollo" Ivanov is regarded as the founding father of the Palladian League,
    an interplanetary alliance that would dominate the Sol System's political landscape for the coming century.
    Callie Yuen, the negotiator from Vortex Prime, becomes the Palladian League's inaugural president.

