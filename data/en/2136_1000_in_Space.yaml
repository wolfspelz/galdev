Markdown: |
  Over recent decades, the population inhabiting space from Earth to the Moon, including the Earth-Moon L4/L5 points and the Earth L1 point, has seen a consistent increase.
  More than a thousand individuals now call these regions in space their home and place of work.
  A substantial segment of this group contributes to the international SCALE project, the Sunlight Control and Limitation Effort, which maintains a sunshade between the Earth and the Sun.

  The International Space Station 2.0, a multinational endeavor led by India, Nigeria, and South China, serves as a hub for scientific research and technological development.
  It houses a hundred individuals representing the many spacefaring nations that work together again in space research after the Crash.

  Various lunar research bases and solar power stations host a tolal of 120 astronauts, taikonauts, und antarikshas.
  The Mars Transit Habitat, a rest and resupply point for Mars-bound missions, operates with a minimal crew of 12.
  Several tourist destinations in orbit and on the moon accommodate about 200 tourists at any time.
  Meanwhile, the Space Debris Collection Network and TOAST, the Transit Orbital Assistance and Space Towing service, each staffed by 30 personnel, mitigate the growing problem of space debris and provide services to satellite and spacecraft operators.

  At the heart of these endeavors lies SCALE.
  This ground-breaking project, initiated in response to the global warming crisis, engages 400 personnel across lunar factories, various points in Earth's orbit, and at the L1 Lagrange point.
  Alongside these engineers, tens of thousands of construction drones autonomously process millions of tons of titanium and aluminum into lattice structures and foil.

  The Off-Earth Manufacturing Facility and Biological Research Station, each with a crew of 25, lead advances in microgravity manufacturing and space medicine.
  Concurrently, lunar ice mining bases and the multi-national Deep Space Gateway, with 20 and 15 staff respectively, provide supplies and fuel for missions beyond near-Earth space.

  Though not yet operational, the Space Elevator Research Station houses 10 personnel focusing on research and development for a future space tether.
  The distributed Deep Space Observatory is home to a total of 15 researchers while various comet research facilities in Earth space and beyond employ 20 scientists, technicians, and prospectors.
  The Interstellar Probe Launch Site, operated by StarSail, is gearing up to dispatch probes into interstellar space.
  A compact technical crew manages the site's powerful lasers and energy stations, essential for propelling these probes.

  A multitude of smaller stations, managed by a combination of private corporations and nation-states, dot the low and high Earth orbits.
  Despite their modest size, these stations house a large share of the space-residing population.
  Much of the research, space resource utilization, and in-situ manufacturing takes place on these stations.
  The ability to produce equipment and spare parts directly in orbit significantly reduces the need for costly cargo launches from Earth.
  These service-focused stations, alongside lunar mining facilities, are the early indicators of an emerging interplanetary economy.

